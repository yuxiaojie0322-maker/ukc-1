name: Create Unikraft Instance

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 部署目标
        required: true
        type: choice
        default: all_three - 部署三地 (新加坡 sin + 美西旧金山 sfo + 法兰克福 fra)
        options:
          - all_three - 部署三地 (新加坡 sin + 美西旧金山 sfo + 法兰克福 fra)
          - sin - 仅新加坡 (Singapore)
          - sfo - 仅美西旧金山 (San Francisco)
          - fra - 仅欧洲法兰克福 (Frankfurt)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /etc/apt/keyrings/unikraft-cli.gpg \
            https://pkg.unikraft.com/debian/cli-apt/keys/cli-apt.gpg
          sudo tee /etc/apt/sources.list.d/unikraft-cli.sources >/dev/null <<EOF
          Types: deb
          URIs: https://pkg.unikraft.com/debian/cli-apt/
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/unikraft-cli.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y unikraft-cli
          unikraft version

      - name: Login to Unikraft Cloud
        env:
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN || secrets.UKC_TOKEN || 'cm9ib3QkeGlhb2ppZXl1LnVzZXJzLmtyYWZ0Y2xvdWQ6UkRRdFJhWDJuUVRpUkJPZFV4cFdieFJZb3pEZ2JhYm0=' }}
        run: echo "$UNIKRAFT_TOKEN" | unikraft login --token -

      - name: Resolve organization name
        id: org
        run: |
          chmod +x scripts/get-org-name.sh
          ORG="$(./scripts/get-org-name.sh)"
          echo "name=${ORG}" >> "$GITHUB_OUTPUT"
          echo "Using organization: ${ORG}"

      - name: Deploy instances and generate nodes
        id: deploy
        env:
          TARGET: ${{ inputs.target || 'all_three' }}
          ORG: ${{ steps.org.outputs.name }}
          UUID: ${{ secrets.UUID || '694949f5-54c3-4113-b3c9-2d2518f770f4' }}
          ARGO_TOKEN_SIN: 'eyJhIjoiOTE5NDQ4ZGZiOWY5MTJiZDhiMGM4MGEyOTgzMTdkYTgiLCJ0IjoiOTk2YzBkNGQtMTRhNy00ZDFkLTlmN2ItYzFlMzZmNmVmNmE3IiwicyI6Ik5tTXhNalUwWW1RdE5ESTVaaTAwWVRJNExXRTFaR010TW1NNVlUTmxNV1JqWWpjMiJ9'
          ARGO_TOKEN_SFO: 'eyJhIjoiOTE5NDQ4ZGZiOWY5MTJiZDhiMGM4MGEyOTgzMTdkYTgiLCJ0IjoiZGYxNmM0MTQtZTJjMC00YTA4LWFmZGItYzYwNzM4MmI1MzNiIiwicyI6Ik16TTFPRFEyWVRrdE4yWTVNUzAwWldabUxUa3dPR1l0TnpOaVl6TXpNek0wTkdGbCJ9'
          ARGO_TOKEN_FRA: 'eyJhIjoiOTE5NDQ4ZGZiOWY5MTJiZDhiMGM4MGEyOTgzMTdkYTgiLCJ0IjoiMzI1NjllZGEtMmQzYy00NmVjLTg3ZmItODkxNDZmOTM4M2RjIiwicyI6Ik1qaGhNRGcwT0RndE9HSmhOUzAwWXpFMUxUbGtZMll0TlRnMllUZzVOalE1T1RWayJ9'
        run: |
          set -euo pipefail
          chmod +x scripts/prepare-config.sh scripts/prepare-config.py scripts/generate-subscription.sh scripts/encrypt-subscription.sh

          METRO_TARGET="${TARGET%% *}"
          
          # Clean unused metros if any
          unikraft instances delete --filter "metro==dal" --force 2>/dev/null || true
          unikraft instances delete --filter "metro==was" --force 2>/dev/null || true

          declare -A METRO_DOMAINS=(
            ["sin"]="unikraft-1.blibli.kdns.fr"
            ["sfo"]="unikraft-us.blibli.kdns.fr"
            ["fra"]="unikraft-eu.blibli.kdns.fr"
          )
          declare -A METRO_TOKENS=(
            ["sin"]="$ARGO_TOKEN_SIN"
            ["sfo"]="$ARGO_TOKEN_SFO"
            ["fra"]="$ARGO_TOKEN_FRA"
          )
          declare -A METRO_NAMES=(
            ["sin"]="🇸🇬新加坡 (Singapore)"
            ["sfo"]="🇺🇸美西旧金山 (San Francisco)"
            ["fra"]="🇩🇪欧洲法兰克福 (Frankfurt)"
          )

          if [[ "$METRO_TARGET" == "all_three" || "$METRO_TARGET" == "all" ]]; then
            ACTIVE_METROS=("sin" "sfo" "fra")
          else
            ACTIVE_METROS=("$METRO_TARGET")
          fi

          DEPLOY_RESULTS=()

          for m in "${ACTIVE_METROS[@]}"; do
            echo "=================================================="
            echo "Deploying metro: $m (${METRO_NAMES[$m]})"
            echo "=================================================="
            domain="${METRO_DOMAINS[$m]}"
            token="${METRO_TOKENS[$m]}"
            
            # Prepare config
            ./scripts/prepare-config.sh "$UUID" "$domain" "$token"
            
            # Build image with specific tag
            IMAGE_TAG="${ORG}/unikraft-${m}:latest"
            unikraft build . --output "$IMAGE_TAG"
            
            # Clean old instance in this metro
            unikraft instances delete --filter "metro==$m" --force 2>/dev/null || true
            
            # Run new instance
            RUN_JSON="$(unikraft run \
              --metro "$m" \
              --publish 443:8080/http+tls \
              -m 512M \
              --image "$IMAGE_TAG" \
              -o json)"
            echo "$RUN_JSON" > "run-${m}.json"
            
            FQDN="$(jq -r '[.. | objects | .fqdn? | select(type == "string")] | first // empty' "run-${m}.json")"
            if [[ -z "$FQDN" || "$FQDN" == "null" ]]; then
              echo "Failed to deploy $m" >&2
              cat "run-${m}.json" >&2
              exit 1
            fi
            echo "Successfully deployed $m at https://${FQDN}"
            DEPLOY_RESULTS+=("${m}|${FQDN}|${domain}|${METRO_NAMES[$m]}")
          done

          # Generate combined subscription text
          ALL_SUBS=""
          RAW_REPORT=""
          
          # Custom CF domains requested by user:
          CUSTOM_CF_DOMAINS=("cdns.doon.eu.org" "hk.cf.090227.xyz" "cf.090227.xyz" "spring.io")

          for line in "${DEPLOY_RESULTS[@]}"; do
            IFS='|' read -r m fqdn domain name <<< "$line"
            RAW_REPORT="${RAW_REPORT}- **${name}**: \`https://${fqdn}\` (隧道: \`${domain}\`)"$'\n'
            
            # 1. Direct official node
            ALL_SUBS="${ALL_SUBS}vless://${UUID}@${fqdn}:443?encryption=none&security=tls&sni=${fqdn}&fp=chrome&insecure=0&allowInsecure=0&type=ws&host=${fqdn}&path=%2F#${name}-官方直连"$'\n'
            
            # 2. Argo Tunnel direct node
            ALL_SUBS="${ALL_SUBS}vless://${UUID}@${domain}:443?encryption=none&security=tls&sni=${domain}&fp=chrome&insecure=0&allowInsecure=0&type=ws&host=${domain}&path=%2F#${name}-Argo直连"$'\n'
            
            # 3. User preferred CF domains
            for cf in "${CUSTOM_CF_DOMAINS[@]}"; do
              ALL_SUBS="${ALL_SUBS}vless://${UUID}@${cf}:443?encryption=none&security=tls&sni=${domain}&fp=chrome&insecure=0&allowInsecure=0&type=ws&host=${domain}&path=%2F#${name}-${cf}"$'\n'
            done
            ALL_SUBS="${ALL_SUBS}"$'\n'
          done

          SUB_URL="$(./scripts/encrypt-subscription.sh "$UUID" "$ALL_SUBS")"

          {
            echo "### 🚀 节点部署完成 (共 ${#DEPLOY_RESULTS[@]} 个地区)"
            echo ""
            echo "${RAW_REPORT}"
            echo ""
            echo "### 🔐 获取完整订阅信息"
            echo ""
            echo "访问下方链接并使用 UUID 解密订阅信息："
            echo ""
            echo "- [👉 在线解密订阅](${SUB_URL})"
            echo ""
            echo "### 📋 原始订阅链接"
            echo "\`\`\`text"
            echo "${ALL_SUBS}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "========================================"
          echo "Encrypted subscription URL:"
          echo "$SUB_URL"
          echo "========================================"
          echo "ALL NODES:"
          echo "$ALL_SUBS"
          echo "========================================"
