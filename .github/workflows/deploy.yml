name: Create Unikraft Instance

on:
  workflow_dispatch:
    inputs:
      metro:
        description: 部署地区（可选择部署全部地区或单个地区）
        required: true
        type: choice
        default: all - 部署全部 5 个地区 (All 5 Metros)
        options:
          - all - 部署全部 5 个地区 (All 5 Metros)
          - dal - 达拉斯 (Dallas, US)
          - fra - 法兰克福 (Frankfurt, DE)
          - sfo - 旧金山 (San Francisco, US)
          - sin - 新加坡 (Singapore)
          - was - 华盛顿 (Washington DC, US)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Unikraft CLI
        run: |
          set -euo pipefail

          # Prefer official apt repo (avoids flaky GitHub release CDN).
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl jq
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            -o /etc/apt/keyrings/unikraft-cli.gpg \
            https://pkg.unikraft.com/debian/cli-apt/keys/cli-apt.gpg
          sudo tee /etc/apt/sources.list.d/unikraft-cli.sources >/dev/null <<EOF
          Types: deb
          URIs: https://pkg.unikraft.com/debian/cli-apt/
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Signed-By: /etc/apt/keyrings/unikraft-cli.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y unikraft-cli
          unikraft version

      - name: Login to Unikraft Cloud
        env:
          UNIKRAFT_TOKEN: ${{ secrets.UNIKRAFT_TOKEN || secrets.UKC_TOKEN }}
        run: echo "$UNIKRAFT_TOKEN" | unikraft login --token -

      - name: Resolve organization name
        id: org
        env:
          UKC_ORG: xiaojieyu
        run: |
          chmod +x scripts/get-org-name.sh
          ORG="$(./scripts/get-org-name.sh)"
          echo "name=${ORG}" >> "$GITHUB_OUTPUT"
          echo "Using organization: ${ORG}"

      - name: Prepare sing-box config
        env:
          UUID: ${{ secrets.UUID || '694949f5-54c3-4113-b3c9-2d2518f770f4' }}
          ARGO_DOMAIN: ${{ secrets.ARGO_DOMAIN }}
          ARGO_TOKEN: ${{ secrets.ARGO_TOKEN }}
        run: |
          if [[ -z "$UUID" ]]; then
            echo "Secret UUID is required." >&2
            exit 1
          fi
          chmod +x scripts/prepare-config.sh
          ./scripts/prepare-config.sh "$UUID" "$ARGO_DOMAIN" "$ARGO_TOKEN"

      - name: Build image
        run: |
          unikraft build . --output "${{ steps.org.outputs.name }}/unikraft:latest"

      - name: Deploy instances
        id: deploy
        env:
          METRO: ${{ inputs.metro }}
          ORG: ${{ steps.org.outputs.name }}
        run: |
          METRO_INPUT="${METRO%% *}"
          if [[ "$METRO_INPUT" == "all" ]]; then
            TARGET_METROS=("sin" "fra" "dal" "sfo" "was")
          else
            TARGET_METROS=("$METRO_INPUT")
          fi

          DEPLOYED_NODES=()
          FAILED_METROS=()

          for m in "${TARGET_METROS[@]}"; do
            echo "========================================"
            echo "Deploying instance to metro: $m"
            echo "========================================"
            echo "Cleaning up any old instance in $m..."
            unikraft instances delete --filter "metro==$m" --force 2>/dev/null || true

            RUN_JSON="$(unikraft run \
              --metro "$m" \
              --publish 443:8080/http+tls \
              -m 512M \
              --image "${ORG}/unikraft:latest" \
              -o json 2>&1 || true)"

            FQDN="$(echo "$RUN_JSON" | jq -r '[.. | objects | .fqdn? | select(type == "string")] | first // empty' 2>/dev/null || true)"
            if [[ -n "$FQDN" && "$FQDN" != "null" ]]; then
              echo "Successfully deployed in $m: https://${FQDN}"
              DEPLOYED_NODES+=("${m}|${FQDN}")
            else
              echo "Deployment in $m failed or returned unexpected output: $RUN_JSON" >&2
              FAILED_METROS+=("$m")
            fi
          done

          if [[ ${#DEPLOYED_NODES[@]} -eq 0 ]]; then
            echo "Failed to deploy in any metro." >&2
            exit 1
          fi

          printf "%s\n" "${DEPLOYED_NODES[@]}" > deployed_nodes.txt
          echo "count=${#DEPLOYED_NODES[@]}" >> "$GITHUB_OUTPUT"

      - name: Generate encrypted subscription link
        id: sub
        env:
          UUID: ${{ secrets.UUID || '694949f5-54c3-4113-b3c9-2d2518f770f4' }}
          ARGO_DOMAIN: ${{ secrets.ARGO_DOMAIN }}
        run: |
          chmod +x scripts/generate-subscription.sh scripts/encrypt-subscription.sh
          
          ALL_SUBS=""
          RAW_LIST=""
          while IFS='|' read -r m fqdn; do
            [[ -z "$m" || -z "$fqdn" ]] && continue
            SUB="$(./scripts/generate-subscription.sh "$UUID" "$fqdn" "$ARGO_DOMAIN")"
            ALL_SUBS="${ALL_SUBS}${SUB}"$'\n'
            RAW_LIST="${RAW_LIST}- **${m^^}**: \`https://${fqdn}\`"$'\n'
          done < deployed_nodes.txt

          SUB_URL="$(./scripts/encrypt-subscription.sh "$UUID" "$ALL_SUBS")"
          echo "sub_url=${SUB_URL}" >> "$GITHUB_OUTPUT"
          PAYLOAD="${SUB_URL#*payload=}"

          {
            echo "### 🚀 节点部署完成 (共 ${{ steps.deploy.outputs.count }} 个)"
            echo ""
            echo "${RAW_LIST}"
            echo ""
            echo "### 🔐 获取完整订阅信息"
            echo ""
            echo "访问下方链接并使用 UUID 解密订阅信息："
            echo ""
            echo "- [👉 本仓库 GitHub Pages 在线解密](${SUB_URL})"
            echo "- [备用解密工具](https://vevc.github.io/unikraft-deploy/?payload=${PAYLOAD})"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "========================================"
          echo "Encrypted subscription URL (decrypt with your UUID):"
          echo "$SUB_URL"
          echo "========================================"

      - name: Send Telegram notification
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUB_URL: ${{ steps.sub.outputs.sub_url }}
          COUNT: ${{ steps.deploy.outputs.count }}
        run: |
          if [[ -n "${TG_BOT_TOKEN:-}" && -n "${TG_CHAT_ID:-}" ]]; then
            PAYLOAD="${SUB_URL#*payload=}"
            MSG="🚀 Unikraft Cloud 节点部署完成 (共 ${COUNT} 个)%0A解密链接: ${SUB_URL}"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${MSG}" || true
          fi
