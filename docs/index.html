<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unikraft 订阅解密</title>
  <style>
    :root {
      --bg: #eef2f7;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #d7dee8;
      --field: #f8fafc;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ok-bg: #ecfdf5;
      --ok-text: #047857;
      --ok-border: #a7f3d0;
      --err-bg: #fef2f2;
      --err-text: #b91c1c;
      --err-border: #fecaca;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2.25rem 1rem 3rem;
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    label {
      display: block;
      font-weight: 650;
      margin-bottom: 0.35rem;
    }

    .hint {
      color: var(--muted);
      font-size: 0.875rem;
      margin: 0 0 0.7rem;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85em;
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.05rem 0.3rem;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--field);
      color: var(--text);
      padding: 0.7rem 0.8rem;
      font: inherit;
    }

    input:focus, textarea:focus {
      outline: 2px solid #bfdbfe;
      border-color: var(--accent);
    }

    textarea {
      min-height: 2.8rem;
      height: auto;
      overflow: hidden;
      resize: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.875rem;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin: 0.15rem 0 1rem;
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 650;
      padding: 0.65rem 1rem;
      cursor: pointer;
    }

    button:hover { background: var(--accent-hover); }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    button.secondary:hover {
      background: var(--field);
    }

    .status {
      display: none;
      margin: 0 0 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: pre-wrap;
    }

    .status.is-visible {
      display: block;
    }

    .status.ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: var(--ok-border);
    }

    .status.err {
      background: var(--err-bg);
      color: var(--err-text);
      border-color: var(--err-border);
    }

    footer {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Unikraft 订阅解密</h1>
    <p class="subtitle">完全在浏览器本地解密，不会上传 UUID 或订阅内容。</p>

    <div class="card">
      <label for="payload">加密 Payload 或完整链接</label>
      <p class="hint">可填入 GitHub Actions Summary 中的完整 URL；或者直接访问，会自动填充该参数。</p>
      <textarea id="payload" rows="2" placeholder="https://vevc.github.io/unikraft-deploy/?payload=..."></textarea>
    </div>

    <div class="card">
      <label for="uuid">解密密钥（UUID）</label>
      <p class="hint">与部署时配置的 UUID 相同，用于 SHA-256 派生 AES-256 密钥。</p>
      <input id="uuid" type="password" autocomplete="off" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
    </div>

    <div class="actions">
      <button id="decrypt" type="button">解密订阅</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div class="card">
      <div class="card-head">
        <div>
          <label for="result">订阅内容</label>
          <p class="hint">解密成功后可复制到剪贴板。</p>
        </div>
        <button id="copy" class="secondary" type="button" disabled>复制订阅</button>
      </div>
      <textarea id="result" readonly rows="3" placeholder="解密结果将显示在这里"></textarea>
    </div>

    <footer>
      Telegram 技术交流群：<a href="https://t.me/vevcLab" target="_blank" rel="noopener noreferrer">维客工坊</a>
    </footer>
  </main>

  <script>
    const payloadEl = document.getElementById("payload");
    const uuidEl = document.getElementById("uuid");
    const resultEl = document.getElementById("result");
    const statusEl = document.getElementById("status");
    const decryptBtn = document.getElementById("decrypt");
    const copyBtn = document.getElementById("copy");

    function autosize(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    function setStatus(message, type) {
      statusEl.textContent = message || "";
      const classes = ["status"];
      if (message && type) {
        classes.push(type, "is-visible");
      }
      statusEl.className = classes.join(" ");
      if (message && type) {
        statusEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    function extractPayload(input) {
      const raw = (input || "").trim();
      if (!raw) {
        return "";
      }

      const urlMatch = raw.match(/https?:\/\/[^\s]+/i);
      const candidate = urlMatch ? urlMatch[0] : raw;

      try {
        const url = new URL(candidate);
        const fromQuery = url.searchParams.get("payload");
        if (fromQuery) {
          return fromQuery.trim();
        }
      } catch (error) {
        // Not a full URL; try query-string extraction below.
      }

      const queryMatch = candidate.match(/[?&]payload=([^&\s#]+)/i);
      if (queryMatch) {
        try {
          return decodeURIComponent(queryMatch[1]).trim();
        } catch (error) {
          return queryMatch[1].trim();
        }
      }

      return raw;
    }

    function hexToBytes(hex) {
      if (!/^[0-9a-fA-F]+$/.test(hex) || hex.length % 2 !== 0) {
        throw new Error("IV 必须是偶数长度的十六进制字符串。请检查 payload 是否完整、是否被截断。");
      }
      const out = new Uint8Array(hex.length / 2);
      for (let i = 0; i < out.length; i += 1) {
        out[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);
      }
      return out;
    }

    function base64ToBytes(b64) {
      const normalized = b64.replace(/\s+/g, "");
      try {
        const binary = atob(normalized);
        const out = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          out[i] = binary.charCodeAt(i);
        }
        return out;
      } catch (error) {
        throw new Error("密文不是有效的 Base64。请确认链接中的 payload 已完整复制，且未经二次编码破坏。");
      }
    }

    async function deriveAesKey(uuid) {
      const encoded = new TextEncoder().encode(uuid);
      const digest = await crypto.subtle.digest("SHA-256", encoded);
      return crypto.subtle.importKey("raw", digest, { name: "AES-CBC" }, false, ["decrypt"]);
    }

    async function decryptPayload(uuid, payload) {
      const separator = payload.indexOf(":");
      if (separator <= 0) {
        throw new Error("Payload 格式无效，应为 IV_HEX:BASE64_CIPHERTEXT。");
      }
      const ivHex = payload.slice(0, separator).trim();
      const ciphertextB64 = payload.slice(separator + 1).trim();
      if (!ivHex || !ciphertextB64) {
        throw new Error("Payload 缺少 IV 或密文。");
      }

      const key = await deriveAesKey(uuid);
      const iv = hexToBytes(ivHex);
      if (iv.length !== 16) {
        throw new Error("IV 长度无效（应为 16 字节 / 32 位十六进制）。");
      }
      const ciphertext = base64ToBytes(ciphertextB64);
      const plaintext = await crypto.subtle.decrypt({ name: "AES-CBC", iv }, key, ciphertext);
      return new TextDecoder().decode(plaintext);
    }

    function explainDecryptError(error) {
      const name = error && error.name ? String(error.name) : "";
      const message = error && error.message ? String(error.message) : "";

      if (name === "OperationError" || name === "InvalidAccessError" || name === "DOMException") {
        return "解密失败：UUID 不正确，或 payload 已损坏。";
      }
      if (message) {
        return message.startsWith("解密失败") ? message : "解密失败：" + message;
      }
      return "解密失败：请检查 UUID 与 Payload。未知错误" + (name ? "（" + name + "）" : "。");
    }

    function loadPayloadFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const payload = params.get("payload");
      if (payload) {
        payloadEl.value = payload;
      }
      autosize(payloadEl);
      autosize(resultEl);
    }

    decryptBtn.addEventListener("click", async () => {
      const uuid = uuidEl.value.trim();
      const payload = extractPayload(payloadEl.value);
      resultEl.value = "";
      autosize(resultEl);
      copyBtn.disabled = true;
      setStatus("");

      if (!payload) {
        setStatus("请粘贴加密 Payload，或 GitHub Actions 日志中的完整链接。", "err");
        return;
      }
      if (!uuid) {
        setStatus("请输入解密密钥。", "err");
        return;
      }

      decryptBtn.disabled = true;
      try {
        const text = await decryptPayload(uuid, payload);
        resultEl.value = text;
        autosize(resultEl);
        copyBtn.disabled = !text;
        setStatus("解密成功。订阅内容已填入下方文本框。", "ok");
      } catch (error) {
        console.error("decrypt failed", error);
        setStatus(explainDecryptError(error), "err");
      } finally {
        decryptBtn.disabled = false;
      }
    });

    copyBtn.addEventListener("click", async () => {
      const text = resultEl.value;
      if (!text) {
        setStatus("没有可复制的订阅内容，请先解密。", "err");
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        setStatus("订阅内容已复制到剪贴板。", "ok");
      } catch (error) {
        resultEl.focus();
        resultEl.select();
        setStatus("自动复制失败，请手动全选文本框内容后复制。", "err");
      }
    });

    payloadEl.addEventListener("input", () => autosize(payloadEl));
    resultEl.addEventListener("input", () => autosize(resultEl));
    loadPayloadFromUrl();
  </script>
</body>
</html>
